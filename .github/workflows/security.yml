name: Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  tests:
    name: Testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: pytest


  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Executar análise SAST
        run: semgrep --config semgrep.yml --error .


  sca:
    name: SCA - pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar pip-audit
        run: pip install pip-audit

      - name: Analisar dependências
        run: pip-audit -r requirements.txt


  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t devsecops-scan .

      - name: Criar rede Docker
        run: docker network create security-net

      - name: Iniciar aplicação
        run: |
          docker run -d \
            --name devsecops-app \
            --network security-net \
            devsecops-scan

      - name: Aguardar aplicação
        run: sleep 10

      - name: Executar OWASP ZAP
        run: |
          docker run --rm \
            --network security-net \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://devsecops-app:5000 \
            -r zap-report.html

      - name: Salvar relatório do ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html
